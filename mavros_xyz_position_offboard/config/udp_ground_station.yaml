mavros_native_xyz_position:
  ros__parameters:
    udp:
      enabled: true
      bind_ip: 0.0.0.0
      bind_port: 5005
      remote_ip: 192.168.10.59
      remote_port: 5005
      whitelist_ip: 192.168.10.59
      whitelist_port: 5005
      event_retry_period_s: 0.5

    mission:
      takeoff_height_m: 1.5
      height_stable_seconds: 3.0

    tracking:
      standoff_m: 0.10
      match_tolerance_m: 0.10
      car_status_timeout_s: 0.5
      max_distance_m: 5.0

    z:
      prefer_range: false
      source_timeout_s: 0.5
      range_cross_check_max_delta_m: 0.30

    gripper_pwm:
      # Disabled is a timed no-op for SITL and prevents all physical GPIO output.
      enabled: false
      chip_path: /sys/class/pwm/pwmchip0
      channel: 0
      period_ns: 20000000
      idle_duty_ns: 1500000
      release_duty_ns: 2000000
      release_delay_ms: 500
      release_hold_ms: 500
      # These must be site-specific and non-empty before enabled:true is accepted.
      pinmux_path: ""
      pinmux_expected: ""
